name: quake_watch
description: Phone-based earthquake detector - sensor recorder, STA/LTA detector and offline analysis lab.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Sensors and device
  sensors_plus: ^6.1.0
  battery_plus: ^6.2.0
  wakelock_plus: ^1.2.8

  # Storage and sharing
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  share_plus: ^10.1.2

  # UI
  fl_chart: ^0.69.0

  # Firebase (Phase 2)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  firebase_app_check: ^0.3.1+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#0B0F14"
  adaptive_icon_foreground: "assets/icons/icon.png"